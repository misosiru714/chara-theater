 st.addEventListener("pointermove",e=>{if(!ptr.has(e.pointerId)||!g)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});const f=curFit();
  if(ptr.size>=2&&g.d){f.s=cl(g.s*dist()/g.d,.2,4)}else if(ptr.size===1){const r=st.getBoundingClientRect(),a=pts()[0];f.x=cl(g.o.x+(a.x-g.x)/r.width*100,-100,100);f.y=cl(g.o.y+(a.y-g.y)/r.height*100,-100,100)}
  applyArt();syncCtl()});
 const end=e=>{if(!ptr.delete(e.pointerId))return;if(ptr.size>0)start();else{g=null;dirty()}};
 st.addEventListener("pointerup",end);st.addEventListener("pointercancel",end);
 st.addEventListener("wheel",e=>{if(!canAdjust())return;e.preventDefault();const f=curFit();f.s=cl(f.s*Math.exp(-e.deltaY*.0015),.2,4);applyArt();syncCtl();dirty()},{passive:false})})();
