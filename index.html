<!DOCTYPE html>
<!--
  きゃらしあたー(仮) — Googleドライブ連携(任意機能)の設定手順
  ------------------------------------------------------------
  Driveに保存するには、自分用の「OAuthクライアントID」が必要です(無料)。
  ※ 連携しなくても、ブラウザ保存とZIPの出力/読み込みは今まで通り使えます。

  [Google Cloud Console での設定]  https://console.cloud.google.com/
   1. プロジェクトを作る(または既存のものを選ぶ)
   2. 「APIとサービス」→「ライブラリ」→「Google Drive API」を有効にする
   3. 「APIとサービス」→「OAuth 同意画面」
        ・ユーザーの種類は「外部」、アプリ名・サポートメール等を入力
        ・スコープは追加しなくてOK(このツールが要求するのは drive.file のみ)
        ・公開ステータスが「テスト」の間は、「テストユーザー」に自分のGoogleアカウントを追加
          (公開する場合は「本番環境に移行」。drive.file は機密性の低いスコープです)
   4. 「APIとサービス」→「認証情報」→「認証情報を作成」→「OAuth クライアント ID」
        ・アプリケーションの種類: ウェブ アプリケーション
        ・「承認済みの JavaScript 生成元」に、このツールを公開するオリジンを登録
            例) https://ユーザー名.github.io   (パスは入れない / 末尾の / も不要)
            例) http://localhost:8000          (動作確認用)
        ・「承認済みのリダイレクト URI」は不要(ポップアップ方式のため)
   5. 発行された「クライアント ID」(…apps.googleusercontent.com)を、
        下の <script> 先頭の GDRIVE_CLIENT_ID に貼り付ける
        (クライアント シークレットは使いません。HTMLに入れないでください)

  [動作環境] https のオリジン(GitHub Pages 等)か localhost でのみ動きます。
             file:// で直接開いた場合はDrive連携ボタンが無効になります(ZIPをご利用ください)。
  [保存先]   マイドライブの「きゃらしあたー」フォルダ(自動作成)。
             drive.file スコープのため、このツールが作ったファイルしか見えません。
-->
