<script>
"use strict";
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else if(k==="class")e.className=a[k];else e[k]=a[k]}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const uid=()=>Math.random().toString(36).slice(2,10);
const track=(n,p)=>{try{if(typeof gtag==="function")gtag("event",n,p||{})}catch(_){}};
const urls=new WeakMap();
const url=b=>b?(urls.get(b)||(urls.set(b,URL.createObjectURL(b)),urls.get(b))):"";
const PRESET=["秘書任命","会話1","会話2","会話3","昇進後会話1","昇進後会話2","信頼上昇後会話1","信頼上昇後会話2","信頼上昇後会話3","放置","入職会話","経験値上昇","昇進Ⅰ","昇進Ⅱ","編成","隊長任命","作戦準備","戦闘開始","選択時1","選択時2","配置1","配置2","作戦中1","作戦中2","作戦中3","作戦中4","高難度作戦クリア","★3で戦闘終了","★2以下戦闘終了","作戦失敗","基地配属","タッチ1","信頼タッチ","タイトルコール","挨拶"];
const newChar=()=>fixChar({id:uid(),name:"新しいキャラ",en:"",role:"",cv:"",il:"",img:null,img2:null,profile:[],voices:[{id:uid(),title:"自己紹介",text:"",audio:null}]});
let S={chars:[],cur:0},mode="view",playing=null,recIdx=null,recorder=null;
const C=()=>S.chars[S.cur];

/* ---------- IndexedDB ---------- */
const dbp=new Promise((ok,ng)=>{const r=indexedDB.open("voice-viewer",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
const kv=async(m,k,v)=>{const db=await dbp;return new Promise((ok,ng)=>{const tx=db.transaction("kv",m==="get"?"readonly":"readwrite");const q=m==="get"?tx.objectStore("kv").get(k):tx.objectStore("kv").put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error)})};
let saveT;
const dirty=()=>{$("#status").textContent="保存中…";clearTimeout(saveT);saveT=setTimeout(async()=>{try{await kv("put","main",S);$("#status").textContent="ブラウザに保存済み"}catch(e){$("#status").textContent="保存に失敗(容量不足かも。ZIP保存がおすすめ)"}},400)};

/* ---------- ZIP(無圧縮・自前実装) ---------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(ch.buffer,nm);off+=30+nm.length+sz}
 let cs=0;cen.forEach(x=>cs+=x.byteLength||x.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
