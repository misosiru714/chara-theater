 add(`<div class="abs l-head">詳細 ▸</div>`);
 c.stats.forEach((s,i)=>{const col=i<4?0:1,row=i%4,left=col?241:28,w=col?203:205;add(`<div class="stat" style="left:${left}px;top:${443+row*48}px;width:${w}px"><i>${s[0]}</i><b>${esc(s[1])}</b></div>`)});
 add(`<div class="abs trust"><span class="lb">信頼度 ▸</span><span class="v">${IC.people.replace("<svg",'<svg width="34" height="34"')}${c.trust}%</span><div class="bar"><u style="width:${Math.min(100,c.trust/2)}%"></u></div></div>`);
 add(`<div class="abs stars">${Array.from({length:6},(_,i)=>`<span style="color:${i<c.stars?"#fff":"#fff6"}">${IC.star}</span>`).join("")}</div>`);
 add(`<div class="abs en" style="font-size:${c.en.length>18?44:56}px">${esc(c.en)}</div>`);
 const ja=add(`<div class="abs ja">${esc(c.name)}</div>`);
 const est=[...c.name].reduce((a,ch)=>a+(ch.charCodeAt(0)<256?.58:1),0);ja.style.fontSize=Math.min(172,Math.floor(640/est))+"px";
 add(`<div class="box" style="left:30px;width:142px;color:#fff">${c.clsIc}</div>`);
 const cells=c.range.cells.map(([x,y])=>`<i style="left:${x*34}px;top:${y*34}px"></i>`).join("")+`<i class="o" style="left:${c.range.o[0]*34}px;top:${c.range.o[1]*34}px"></i>`;
 add(`<div class="box" style="left:184px;width:227px"><div class="rng">${cells}</div><small>攻撃範囲</small></div>`);
 const t1=esc(c.tags[0]),t2=esc(c.tags[1]);
 add(`<div class="tag" style="top:958px;height:42px;font-size:32px">${t1}</div>`);add(`<div class="tag" style="top:1010px;height:90px">${t2}</div>`);
 if(c.extra)add(`<div class="box" style="left:664px;width:142px">${c.extra.ic}<small>${esc(c.extra.t)}</small></div>`);
 // right
 add(`<div class="abs ring rcol">${ring(c)}<div class="t"><small>LV</small><b>${c.lv}</b></div><span class="mx" style="position:absolute;left:152px;top:126px;font-size:34px;color:#fff">/${c.max}</span></div>`);
 add(`<div class="abs dk exp rcol"><div><small>EXP</small>${c.ex?`<span style="color:#f4c20d">${c.ex[0]}</span>/${c.ex[1]}`:"–/–"}</div>${c.ex?'<span class="pl">+</span>':'<span class="mx">MAX</span>'}</div>`);
 add(`<div class="big dk rcol" style="left:1678px;width:288px">${IC.elite}<em>${esc(c.elite[0])}<small>${esc(c.elite[1])}</small></em></div>`);
 add(`<div class="big dk rcol" style="left:1981px;width:285px">${IC.pot}<em>${esc(c.pot[0])}<small>${esc(c.pot[1])}</small></em></div>`);
 const sk=add(`<div class="abs dk sk rcol"></div>`);
 c.skills.forEach((s,i)=>{const x=22+i*140;sk.append(el(s.empty?`<div class="c" style="left:${x}px"><div class="ic empty">${IC.slash.replace("<svg",'<svg width="64" height="64" style="color:#fff4"')}</div></div>`:`<div class="c" style="left:${x}px" data-sk="${i}"><div class="ic ${s.sel?"on":""}">${skIcon(s.a[0],s.a[1],s.g)}</div><p>${esc(s.t)}</p></div>`))});
 sk.append(el(`<div class="rk">${c.rank}<b>特化 ${IC.tri.replace("<svg",'<svg width="30" height="30" style="vertical-align:middle"')}</b></div>`));
 const bp=add(`<div class="abs dk bp rcol"></div>`);
 bp.append(el(`<div class="cls">${c.clsIc}</div>`),el(`<div class="cn">${esc(c.bp.cls)}</div>`));
 if(c.bp.mod){bp.append(el(`<div class="mod">${c.panel.mods?c.panel.mods.find(m=>m.sel)?.g||"":""}<small>${esc(c.bp.mod)}</small></div>`),el(`<div class="st">STAGE <b>${c.bp.stage}</b><br>確認 +</div>`))}
 else bp.append(el(`<div class="mod" style="border-color:#fff2">${IC.slash.replace("<svg",'<svg width="64" height="64" style="color:#fff5"')}</div>`),el(`<div class="st" style="top:60px;right:30px">モジュール</div>`));
 bp.append(el(`<div class="tags">${c.bp.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`),el(`<button class="ex" data-open="1">▼</button>`));
 add(`<div class="abs pg"><button data-pg="-1">◀</button><u></u><button data-pg="1">▶</button></div>`);
 // expanded
 const p=c.panel,ex=add(`<div class="abs dk ex-p ${open?"show":""}"><div class="ex-h" data-open="0">▲ 職分+</div><div class="ex-b"></div></div>`),b=ex.querySelector(".ex-b");
 b.append(el(`<div class="sub"><span class="cls2">${c.clsIc}</span>${esc(p.cls)}</div>`),el(`<div class="sec">モジュール</div>`));
 if(p.mods){b.append(el(`<div class="slots">${p.mods.map(m=>`<div class="slot ${m.sel?"sel":""}">${m.g.replace("<svg",'<svg width="64" height="64"')}${m.n?`<div style="position:absolute;bottom:6px">${esc(m.n)}</div>`:""}</div>`).join("")}</div>`),el(`<div class="mname">${esc(p.mname)}</div>`),el(`<div class="dfl">デフォルト</div>`),el(`<div class="mrow"><span>STAGE <b>${p.stage}</b></span><span class="mi">＋ モジュール情報</span></div>`))}
 else b.append(el(`<div style="font-size:50px;color:#fff6;margin-top:12px">/</div>`));
 b.append(el(`<hr>`),el(`<div class="sec">特性</div>`),el(`<div class="txt">${kw(p.trait)}</div>`),el(`<div class="sec">素質</div>`));
 p.talents.forEach(t=>b.append(el(`<div><span class="chip tg">${esc(t.t)}</span><div class="txt">${kw(t.d)}</div></div>`)));
 attachBar(b,ex);
 $("#art").className=userBg?"":"ph";$("#art").style.backgroundImage=userBg?`url(${userBg})`:c.bg;
 $("#shade").style.display=shade?"":"none";
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>toast("→ "+b.dataset.go+"(試作のため移動しません)"));
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{open=b.dataset.open==="1";build()});
 document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>go(+b.dataset.pg));
 document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{CH[cur].skills.forEach((s,i)=>{if(!s.empty)s.sel=i===+b.dataset.sk?1:0});build()});
 [...document.querySelectorAll("#chbtns button")].forEach((b,i)=>b.classList.toggle("on",i===cur));
}
function attachBar(sc,par){const th=el('<div class="sbthumb"></div>');par.append(th);const upd=()=>{const ch=sc.clientHeight,sh=sc.scrollHeight;if(!ch||sh<=ch+1){th.style.display="none";return}th.style.display="";const H=Math.max(40,ch*ch/sh),max=ch-H;th.style.height=H+"px";th.style.top=(sc.offsetTop+sc.scrollTop/(sh-ch)*max)+"px";th.style.left=(sc.offsetLeft+sc.clientWidth-14)+"px"};sc.addEventListener("scroll",upd);requestAnimationFrame(upd);setTimeout(upd,60)}
function go(d){cur=(cur+d+CH.length)%CH.length;open=false;build()}
function fit(){const s=Math.min(innerWidth/2330,innerHeight/1159);$("#stage").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);if(e.key==="Escape"&&open){open=false;build()}});
$("#chbtns").append(...CH.map((c,i)=>{const b=document.createElement("button");b.textContent=(i+1)+":"+(i===2?"長い名前":c.name);b.onclick=()=>{cur=i;open=false;build()};return b}));
$("#file").onchange=e=>{const f=e.target.files[0];if(f){userBg=URL.createObjectURL(f);build()}};
$("#bShade").onclick=()=>{shade=!shade;$("#bShade").classList.toggle("on",shade);build()};
addEventListener("dragover",e=>e.preventDefault());addEventListener("drop",e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));if(f){userBg=URL.createObjectURL(f);build()}});
fit();build();
</script>
</body>
